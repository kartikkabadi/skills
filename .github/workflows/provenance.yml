name: Provenance

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compile provenance tools
        run: python3 -m py_compile scripts/*.py

      - name: Verify repository provenance
        run: python3 scripts/verify_provenance.py

      - name: Verify pinned upstream files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_upstream.py

      - name: Verify generated notices
        run: python3 scripts/render_notices.py --check

      - name: Build and verify public export
        shell: bash
        run: |
          set -euo pipefail
          export_root="${RUNNER_TEMP}/public-skills"
          python3 scripts/export_public.py "$export_root"
          python3 scripts/verify_provenance.py --root "$export_root"
          python3 scripts/render_notices.py --root "$export_root" --check
          test -e "$export_root/find-skills/SKILL.md"
          test "$(find "$export_root" -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)" -eq 57

      - name: Prove tampering is detected
        shell: bash
        run: |
          set -euo pipefail
          tampered="${RUNNER_TEMP}/tampered-skills"
          python3 scripts/export_public.py "$tampered"
          printf '\nunauthorized change\n' >> "$tampered/caveman/SKILL.md"
          if python3 scripts/verify_provenance.py --root "$tampered"; then
            echo "verifier accepted a tampered skill" >&2
            exit 1
          fi

      - name: Prove missing license text is detected
        shell: bash
        run: |
          set -euo pipefail
          incomplete="${RUNNER_TEMP}/incomplete-skills"
          python3 scripts/export_public.py "$incomplete"
          rm "$incomplete/LICENSES/Cloudflare-Apache-2.0.txt"
          if python3 scripts/verify_provenance.py --root "$incomplete"; then
            echo "verifier accepted a missing upstream license" >&2
            exit 1
          fi
      - name: Prove unsafe output replacement is refused
        shell: bash
        run: |
          set -euo pipefail
          unmarked="${RUNNER_TEMP}/unmarked-output"
          mkdir "$unmarked"
          touch "$unmarked/sentinel"
          if python3 scripts/export_public.py "$unmarked" --force; then
            echo "exporter removed an unmarked directory" >&2
            exit 1
          fi
          test -f "$unmarked/sentinel"

      - name: Prove symlinked skills are rejected
        shell: bash
        run: |
          set -euo pipefail
          linked="${RUNNER_TEMP}/linked-skills"
          python3 scripts/export_public.py "$linked"
          rm "$linked/caveman/SKILL.md"
          ln -s ../LICENSE "$linked/caveman/SKILL.md"
          if python3 scripts/verify_provenance.py --root "$linked"; then
            echo "verifier accepted a symlinked skill" >&2
            exit 1
          fi

      - name: Prove path traversal is rejected
        shell: bash
        run: |
          set -euo pipefail
          traversal="${RUNNER_TEMP}/traversal-skills"
          python3 scripts/export_public.py "$traversal"
          python3 - "$traversal/skills.provenance.json" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8") as handle:
              manifest = json.load(handle)
          manifest["skills"][0]["name"] = "../escape"
          manifest["skills"][0]["path"] = "../escape/SKILL.md"
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2)
              handle.write("\n")
          PY
          if python3 scripts/verify_provenance.py --root "$traversal"; then
            echo "verifier accepted path traversal" >&2
            exit 1
          fi
